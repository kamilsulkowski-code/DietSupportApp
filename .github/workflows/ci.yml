name: Kontrola jakości

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sprawdź strukturę aplikacji
        run: python3 scripts/validate_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sprawdź generator, zakupy, promocje i parser OpenAI
        run: node --test scripts/generate_plan.test.mjs
      - name: Sprawdź formularz logowania kodem (bez maili i sieci)
        run: node --test scripts/auth_otp.test.mjs
      - name: Sprawdź kryteria jadłospisu dnia
        run: node --test scripts/task3_acceptance.test.mjs
